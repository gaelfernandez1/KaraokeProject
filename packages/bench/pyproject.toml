[project]
name = "karaoke-bench"
version = "0.1.0"
description = "Benchmark for the karaoke engine: transcription, sync, speed and memory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "karaoke-contracts",
    "karaoke-engine",
    "pydantic>=2.12",
    "jiwer>=4.0",
    "numpy>=2.1",
    "nvidia-ml-py>=13",
]

[project.optional-dependencies]
# Baseline models for the bench. Only the GPU machine installs them.
ml = [
    "torch>=2.14",
    "torchaudio>=2.9",
    "transformers>=5.21",
    "huggingface-hub",
    "faster-whisper==1.2.1",
    "nvidia-cublas-cu12",
    "demucs==4.0.1",
]

[project.scripts]
karaoke-bench = "karaoke_bench.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
karaoke-contracts = { workspace = true }
karaoke-engine = { workspace = true }
