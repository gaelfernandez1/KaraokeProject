[project]
name = "karaoke-engine"
version = "0.1.0"
description = "Karaoke engine: audio, lyrics alignment, packaging and rendering"
requires-python = ">=3.12,<3.13"
dependencies = ["karaoke-contracts", "pydantic>=2.12"]

[project.optional-dependencies]
ml = [
    "torch>=2.8",
    "audio-separator[cpu]==0.47.1",
    # Declared so they resolve like torch: torchvision from the CUDA index, and audioread,
    # which audio-separator imports without declaring it.
    "torchvision",
    "audioread>=3.1",
]

[project.scripts]
karaoke = "karaoke_engine.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
karaoke-contracts = { workspace = true }
