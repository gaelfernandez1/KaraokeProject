[project]
name = "karaoke-engine"
version = "3.0.0"
description = "Karaoke engine: audio, lyrics alignment, packaging and rendering"
requires-python = ">=3.12,<3.13"
dependencies = ["karaoke-contracts", "pydantic>=2.12", "numpy>=2.1"]

[project.optional-dependencies]
ml = [
    "torch>=2.8",
    "transformers>=5.21",
    "huggingface-hub",
    "faster-whisper==1.2.1",
    "ctranslate2>=4.8",
    "nvidia-cublas-cu12",
    "audio-separator[cpu]==0.47.1",
    # Declared so they resolve like torch: torchvision from the CUDA index, and audioread,
    # which audio-separator imports without declaring it.
    "torchvision",
    "audioread>=3.1",
]

[project.scripts]
karaoke = "karaoke_engine.cli:main"

[tool.deptry.per_rule_ignores]
# Declared but never imported by name: cuBLAS 12 is preloaded by path for CTranslate2, torchvision
# must resolve from the CUDA index like torch, and audio-separator imports audioread undeclared.
DEP002 = ["nvidia-cublas-cu12", "torchvision", "audioread"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
karaoke-contracts = { workspace = true }
