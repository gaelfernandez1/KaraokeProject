# Stress set: songs of the quick set with the trouble real karaoke songs bring, built locally
# with `karaoke-bench fetch --set stress` (needs the jamendo set). Every edit knows how far it
# moves the audio, so the hand-made word timings stay exact. One group per kind of trouble, one
# song per language in each group:
#   gap           30 s of the song's own instrumental inserted before a middle line
#   adlib         a sung phrase from elsewhere pasted into a pause (not in the lyrics there)
#   echo          4 lines echoed 0.8 s later at -8 dB, like backing vocals answering
#   web           lyrics as lyrics sites give them: section labels, "x2" and "(yeah)" ad-libs
#   missing-line  one sung line left out of the lyrics
#   extra-lines   two lines of another song added to the lyrics, never sung
# Bump `version` after changing anything here or in stress.py: songs are rebuilt.
version = 1

[[songs]]
id = "gap-kinematic"
source = "Kinematic_-_Peyote"
group = "gap"
seed = 1

