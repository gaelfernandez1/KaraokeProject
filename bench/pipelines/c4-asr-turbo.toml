# Transcription without lyrics with Whisper large-v3-turbo, then the lyrics aligner on the transcribed lines.
name = "c4-asr-turbo"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper large-v3-turbo (VAD, voice check, fixed seed) + line segmenter + lyrics aligner"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_engine.transcribe:WhisperTranscriber"
params = { model = "large-v3-turbo" }

[steps.segmenter]
target = "karaoke_engine.transcribe:LineSegmenter"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
