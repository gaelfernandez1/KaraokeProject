# ifrz Galician model, for comparison only (no licence)
name = "c4-ifrz"
description = "Mel-Band RoFormer (Kim, 8 s) + Whisper large-v3-turbo + lyrics aligner (ifrz Galician model, for comparison only (no licence))"

[steps.separator]
target = "karaoke_engine.separation:RoformerSeparator"
params = { model = "vocals_mel_band_roformer.ckpt", segment_size = 801 }

[steps.transcriber]
target = "karaoke_bench.baseline.whisper:FasterWhisperTranscriber"
params = { model = "large-v3-turbo" }

[steps.segmenter]
target = "karaoke_bench.baseline.segment:SegmentPerLine"

[steps.aligner]
target = "karaoke_engine.align.aligner:LyricsAligner"
params = { model = "ifrz-gl" }
