name: CI

on:
  push:
    branches: ["main", "v3/**"]
  pull_request:
    branches: ["main"]

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit (the tag is in the comment).
jobs:
  python:
    name: Python (lint, types, tests)
    # The same Ubuntu as the development laptop, for its ffmpeg 8 with libass: the audio, video
    # and `make` tests run here too. KARAOKE_STRICT_SKIPS turns any other skip into a failure
    # (only GPU, models and downloaded data may be missing; see conftest.py).
    runs-on: ubuntu-26.04
    env:
      KARAOKE_STRICT_SKIPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      # ruff, deptry (declared dependencies) and import-linter (package boundaries)
      - run: make lint
      - run: make typecheck
      - run: uv run pytest -q -n 4

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser (phone, laptop and TV against the stand-in server)
    # The tests against the real server (`pnpm test:e2e:server`) stay local: they need the
    # real songs' audio, which is downloaded with the bench.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The background tests make a short video with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      # The example songs' audio is not in git: synthetic beeps on every syllable stand in for it
      # (locally the real songs come from the bench, docs/benchmark.md).
      - run: for package in fixtures/packages/*/; do uv run karaoke demo "$package"; done
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --dir web test:e2e
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  install:
    name: Install script (fresh Ubuntu, Node ${{ matrix.node }}, run twice)
    # What `make install` does on a new machine: uv and pnpm are not preinstalled here, so the
    # script installs them; the second run must find nothing left to do and still pass. Node 22
    # brings corepack; Node 26 (LTS) no longer does, so pnpm comes from npm there.
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: scripts/install.sh --no-models
      - run: scripts/install.sh --no-models
      - name: The app is built and the commands run
        run: |
          test -f web/build/index.html
          .venv/bin/karaoke --help > /dev/null
          .venv/bin/karaoke-server --help > /dev/null

  contracts:
    name: Contracts in sync (schemas and TS types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: make contracts
      - name: Fail if generated files are stale or missing
        # git status also catches newly generated files that were never committed.
        run: |
          changes=$(git status --porcelain -- schemas web/src/lib/contracts/generated web/src/lib/api/generated)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- schemas web/src/lib/contracts/generated web/src/lib/api/generated
            echo "::error::Generated contracts are out of date; run 'make contracts' and commit."
            exit 1
          fi

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uvx zizmor@1 --offline .github/workflows
