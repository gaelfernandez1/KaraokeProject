[project]
name = "karaoke-workspace"
version = "0.0.0"
description = "Workspace root for the v3 karaoke generator (Galician first)"
requires-python = ">=3.12,<3.13"
dependencies = ["karaoke-contracts", "karaoke-engine", "karaoke-bench"]

[project.optional-dependencies]
# GPU stack for the engine. Kept out of the default sync so CI and the web
# side never download torch.
ml = ["karaoke-engine[ml]", "karaoke-bench[ml]"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.17", "mypy>=2.4", "pre-commit>=4.7"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
karaoke-contracts = { workspace = true }
karaoke-engine = { workspace = true }
karaoke-bench = { workspace = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT"]
# Lyrics legitimately use typographic apostrophes and accents.
allowed-confusables = ["’", "‘", "´"]

[tool.ruff.lint.isort]
known-first-party = ["karaoke_contracts", "karaoke_engine", "karaoke_bench"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "packages/engine/src", "packages/bench/src"]

# Libraries without type information used by the bench (the optional ones live in the ml extra).
[[tool.mypy.overrides]]
module = ["pynvml", "faster_whisper.*", "demucs.*", "ctranslate2.*", "audio_separator.*"]
ignore_missing_imports = true

# The contract models accept unknown fields at runtime (forward compatibility); mypy still
# flags misspelled keyword arguments when our own code builds them.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages", "scripts"]
