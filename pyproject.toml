[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.1.0"
requires-python = ">=3.10"
description = "Automatic karaoke video generator for minority languages"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Shared Flask web layer, async queue, and common utilities
core = [
    "Flask==2.3.3",
    "Werkzeug==2.3.7",
    "blinker==1.6.3",
    "itsdangerous==2.1.2",
    "celery==5.3.4",
    "redis==5.0.1",
    "flask-limiter==3.5.0",
    "flask-babel>=3.0",
    "flask-login==0.6.3",
    "requests==2.32.3",
    "pyphen==0.14.0",
    "setuptools==69.5.1",
    "wheel==0.43.0",
    "packaging==24.1",
    "pydantic-settings>=2.0.0",
    "python-json-logger>=2.0.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
]

# Thin web container: Flask app server on top of the shared core layer.
# gunicorn lives here only — the worker runs Celery, not an HTTP server.
web = [
    "karaoke[core]",
    "gunicorn==22.0.0",
]

# Demucs/Celery worker container: GPU, audio separation, video rendering.
# numpy/Pillow/yt-dlp live here, not in core: the thin web image never imports
# them (yt-dlp downloads run in the worker, which has ffmpeg).
worker = [
    "karaoke[core]",
    "yt-dlp==2024.8.6",
    "numpy==1.26.4",
    "Pillow==10.0.1",
    "torch==2.3.0",
    "torchaudio==2.3.0",
    "torchvision==0.18.0",
    "demucs==4.0.1",
    "moviepy==1.0.3",
    "soundfile==0.12.1",
    "librosa==0.10.2",
    "scipy==1.13.1",
    "imageio==2.34.2",
    "imageio-ffmpeg==0.4.9",
    "pyannote.audio==3.1.1",
    "pyannote.core==5.0.0",
    "faster-whisper==1.0.1",
    # psutil is used directly in celery_app signal handlers; pulled transitively
    # by celery but listed here so the direct dependency is explicit
    "psutil",
]

# WhisperX service container: transcription + forced alignment
# Note: requests version discrepancy — requirementsB.txt pins 2.32.3 but
# Dockerfile.B's inline pip install used 2.31.0. Using 2.32.3 to match the
# requirements file; revert to 2.31.0 here if the whisperx service regresses.
whisperx = [
    "torch==2.3.0",
    "torchaudio==2.3.0",
    "torchvision==0.18.0",
    "whisperx==3.1.3",
    "faster-whisper==1.0.1",
    "openai-whisper==20231117",
    "Flask==2.3.3",
    "Werkzeug==2.3.7",
    "blinker==1.6.3",
    "itsdangerous==2.1.2",
    "librosa==0.10.2",
    "soundfile==0.12.1",
    "scipy==1.13.1",
    "pyphen==0.14.0",
    "numpy==1.26.4",
    "requests==2.32.3",
    "pyannote.audio==3.1.1",
    "pyannote.core==5.0.0",
    "torch-audiomentations==0.11.1",
    "torchaudio-augmentations==0.2.4",
    "setuptools==69.5.1",
    "wheel==0.43.0",
    "packaging==24.1",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = [
    "UP006",  # List[X] → list[X], deferred to F5+
    "UP007",  # Optional[X] → X | None, deferred to F5+
    "UP035",  # typing imports deprecated, deferred to F5+
    "SIM102", # nested ifs, style preference
    "SIM105", # contextlib.suppress, style preference
    "SIM108", # ternary operator, style preference
    "SIM117", # merged with-statements, style preference
    "N818",   # ProcessingCancelledException → Error suffix, deferred to F5+
    "E501",   # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["karaoke"]

[tool.ruff.lint.per-file-ignores]
# TFG-era modules keep their original camelCase locals (carpetaSeparado, etc.).
# Renaming them is an out-of-scope mass rewrite per CLAUDE.md, so silence N806 here.
"src/karaoke/domain/karaoke_rendering.py" = ["N806"]
"src/karaoke/infra/audio_processing.py" = ["N806"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "karaoke.domain.srt_processing",
    "karaoke.domain.syllabification",
    "karaoke.domain.text_processing",
    "karaoke.infra.metadata_utils",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "karaoke.domain",
    "karaoke.domain.karaoke_generator",
    "karaoke.domain.karaoke_rendering",
    "karaoke.domain.render_config",
    "karaoke.api",
    "karaoke.api.app",
    "karaoke.api.errors",
    "karaoke.api.generation",
    "karaoke.api.health",
    "karaoke.api.library",
    "karaoke.api.player",
    "karaoke.api.tasks",
    "karaoke.workers",
    "karaoke.workers.celery_app",
    "karaoke.workers.celery_tasks",
    "karaoke.infra.audio_processing",
    "karaoke.infra.db",
    "karaoke.infra.db.engine",
    "karaoke.infra.db.models",
    "karaoke.infra.db.repository",
    "karaoke.infra.gpu_utils",
    "karaoke.infra.utils",
    "karaoke.infra.video_processing",
    "karaoke.infra.whisperx_client",
    "karaoke.config",
    "karaoke.security",
    "karaoke.logging_config",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src/karaoke --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test",
    "slow: mark test as slow",
]

[tool.coverage.run]
source = ["src/karaoke"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
