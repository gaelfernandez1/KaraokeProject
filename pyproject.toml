[project]
name = "karaoke-workspace"
version = "0.0.0"
description = "Workspace root for the v3 karaoke generator (Galician first)"
requires-python = ">=3.12,<3.13"
dependencies = ["karaoke-contracts", "karaoke-engine", "karaoke-bench", "karaoke-server"]

[project.optional-dependencies]
# GPU stack for the engine. Kept out of the default sync so CI and the web
# side never download torch.
ml = ["karaoke-engine[ml]", "karaoke-bench[ml]"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.17", "mypy>=2.4", "pre-commit>=4.7", "httpx>=0.28", "deptry>=0.24", "import-linter>=2.5", "pytest-xdist>=3.8", "hypothesis>=6.140", "schemathesis>=4.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
karaoke-contracts = { workspace = true }
karaoke-engine = { workspace = true }
karaoke-bench = { workspace = true }
karaoke-server = { workspace = true }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
# Beyond style: families that catch bugs (ASYNC: blocking the server's event loop; S: security;
# BLE: swallowed errors; DTZ: naive datetimes; PLW/PLE, PIE, PGH, LOG/G, TRY: error handling).
# ARG, FAST and PERF were tried and left out: here they only flagged FastAPI dependencies kept
# for their side effect, protocol signatures and micro-optimisations.
select = [
    "E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT",
    "ASYNC", "S", "BLE", "DTZ", "PIE", "PGH", "PLE", "PLW", "T20", "C4", "LOG", "G",
    "TRY002", "TRY004", "TRY201", "TRY300", "TRY401",
]
# S603/S607: every subprocess here runs ffmpeg, yt-dlp or systemd tools from an argument list,
# never through a shell. S101: asserts are for tests and type narrowing.
ignore = ["S101", "S603", "S607"]
# Lyrics legitimately use typographic apostrophes and accents.
allowed-confusables = ["’", "‘", "´"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S106", "S108", "S310", "S311", "T20", "ASYNC", "PLW1510"]
"scripts/**" = ["T20"]
# Command-line entry points talk to the user on stdout; the job runner speaks JSON lines on it.
"**/cli.py" = ["T20"]
"packages/server/src/karaoke_server/jobs/runner.py" = ["T20"]
"packages/engine/src/karaoke_engine/subtitles/conformance.py" = ["T20"]
"packages/contracts/src/karaoke_contracts/schema_export.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["karaoke_contracts", "karaoke_engine", "karaoke_bench", "karaoke_server"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/contracts/src", "packages/engine/src", "packages/bench/src", "packages/server/src"]

# Libraries without type information used by the bench (the optional ones live in the ml extra).
[[tool.mypy.overrides]]
module = ["pynvml", "faster_whisper.*", "demucs.*", "ctranslate2.*", "audio_separator.*"]
ignore_missing_imports = true

# The ml extra (torch and the Hugging Face libraries) is only installed on the GPU machine; CI
# type-checks without it, where these imports resolve to Any.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

# The contract models accept unknown fields at runtime (forward compatibility); mypy still
# flags misspelled keyword arguments when our own code builds them.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
# Tests that load real models run apart (`make test-models`): together they need 5 GB of RAM.
addopts = "-ra --import-mode=importlib -m \"not models\""
markers = ["models: loads real ML models (2 to 3 GB of RAM); run alone with `make test-models`"]
testpaths = ["packages", "scripts"]

# Package boundaries, checked by `make lint` (lint-imports). Imports inside functions count too.
[tool.importlinter]
root_packages = ["karaoke_contracts", "karaoke_engine", "karaoke_bench", "karaoke_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contracts, then the engine, then the bench and the server (which never import each other)"
type = "layers"
layers = ["karaoke_bench | karaoke_server", "karaoke_engine", "karaoke_contracts"]

[[tool.importlinter.contracts]]
name = "The contracts only need pydantic"
type = "forbidden"
source_modules = ["karaoke_contracts"]
forbidden_modules = ["numpy", "torch", "fastapi", "starlette", "uvicorn", "jiwer", "transformers"]

# The server process must stay small: models load only in the child process of a job
# (jobs.runner), so a crash or the RAM a model keeps never takes the API down.
[[tool.importlinter.contracts]]
name = "The server process never imports the models"
type = "forbidden"
source_modules = ["karaoke_server"]
forbidden_modules = [
    "torch",
    "torchaudio",
    "transformers",
    "faster_whisper",
    "ctranslate2",
    "audio_separator",
    "demucs",
    "huggingface_hub",
]
ignore_imports = ["karaoke_server.jobs.runner -> karaoke_engine.**"]
